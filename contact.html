  <body>
    <nav class="top-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>

    <main class="contact-page">
      <header class="contact-header">
        <h1>Get in Touch</h1>
        <p>Have a question or want to chat? Send me a message!</p>
      </header>

      <section class="contact-form-section">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
          <input type="hidden" name="access_key" value="4e2d541a-9d26-4601-8ba5-58b7be1764a5">
          <input type="hidden" name="redirect" value="https://sicxz.github.io/desn368-portfolio/thanks.html">
          
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required rows="8"></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Last updated <time datetime="2026-11-23">November 23, 2026</time>.</p>
    </footer>
  </body>
